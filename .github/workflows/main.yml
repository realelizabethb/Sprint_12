name: Go TryApplication CI/CD

on:
    push:
        branches: ["main"]
        tags: ["v*"]
jobs:
    tests:
        name: Run Test 
        runs-on: ubuntu-latest
        steps:
            - name: Check code
            uses: actions/checkout@v4

            - name: Install go
            uses: actions/setup-go@v5
            with:
                go-version: '1.22'

            - name: Run testing
                run: go test -v ./...
    build-and-push:
        name: Build Docker Image and Push to DockerHub
        runs-on: ubuntu-latest
        needs: tests

        if: startsWith(github.ref, 'refs/tags/')

        steps:
            - name: Check out code
            uses: actions/checkout@v4
            - name: Autorization Docker
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }} 
                password: ${{ secrets.DOCKERHUB_TOKEN }}  
            - name: build and push image to docker
            uses: docker/build-push-action@v5
            with: 
                context: .
                push: true
             tags: ${{ secrets.DOCKERHUB_USERNAME }}/tracker-app:${{ github.ref_name }}